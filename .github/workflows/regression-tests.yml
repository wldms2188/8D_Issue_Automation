name: Regression Tests

on:
  push:
    branches:
      - test/v308-synthetic
  workflow_dispatch:

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile classifier
        run: python -m py_compile app/origin_v1_refined_patch.py
      - name: Compile output selector
        run: python -m py_compile app/output_variant_final.py app/main_enterprise_final.py
      - name: Origin classifier regression
        run: python -m unittest tests.test_origin_classifier -v
      - name: Problem summary regression
        run: python -m unittest tests.test_problem_summary_blocks -v
