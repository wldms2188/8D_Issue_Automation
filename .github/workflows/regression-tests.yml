name: Regression Tests

on:
  push:
    branches:
      - test/v308-synthetic
  workflow_dispatch:

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install openpyxl python-pptx
      - name: Compile final modules
        run: python -m py_compile app/origin_v1_refined_patch.py app/final_output_polish.py app/output_variant_final.py app/team_autocomplete_final.py app/project_autocomplete_final.py app/project_weekly_match_final.py app/english_8d_final.py app/main_enterprise_final.py
      - name: Origin classifier regression
        run: python -m unittest tests.test_origin_classifier -v
      - name: Project catalog regression
        run: python -m unittest tests.test_project_catalog -v

      - name: English 8D regression
        run: python -m unittest tests.test_english_8d -v

      - name: Problem summary regression
        run: python -m unittest tests.test_problem_summary_blocks -v
