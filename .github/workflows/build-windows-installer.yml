name: Build Windows Installer

on:
  push:
    branches:
      - repair/user-stable-667623-five-fixes
    paths:
      - "app/**"
      - "requirements.txt"
      - "8D_Issue_Automation.spec"
      - "build_exe.bat"
      - "build_release.bat"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check stable runtime
        shell: pwsh
        run: |
          python -m py_compile app\main_enterprise_final.py app\user_stable_weekly_fixes.py

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean 8D_Issue_Automation.spec
          if (!(Test-Path "dist\8D_Issue_Automation.exe")) {
            throw "PyInstaller did not create dist\8D_Issue_Automation.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (!(Test-Path $iscc)) {
            throw "Inno Setup 6 ISCC.exe was not found"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\8D_Issue_Automation.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }
          $setup = "installer\output\8D_Issue_Automation_Stable_4ea1958_Setup.exe"
          if (!(Test-Path $setup)) {
            throw "Installer was not created: $setup"
          }

      - name: Write build information
        shell: pwsh
        run: |
          $setup = "installer\output\8D_Issue_Automation_Stable_4ea1958_Setup.exe"
          $exe = "dist\8D_Issue_Automation.exe"
          @(
            "Application behavior baseline: 4ea1958"
            "Repository commit used for packaging: $env:GITHUB_SHA"
            "Built on GitHub Windows runner"
            ""
            "EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
            "SETUP SHA256: $((Get-FileHash $setup -Algorithm SHA256).Hash)"
          ) | Set-Content -Encoding UTF8 "installer\output\BUILD_INFO.txt"

      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: 8D_Issue_Automation_Stable_4ea1958_Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            installer/output/8D_Issue_Automation_Stable_4ea1958_Setup.exe
            installer/output/BUILD_INFO.txt
            dist/8D_Issue_Automation.exe
            installer/8D_Issue_Automation.iss
            8D_Issue_Automation.spec
            build_release.bat
